name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Tests
        # No external service is reached: the database, WhatsApp, Anthropic and the ERP are test doubles.
        # The schema and RLS suites need SUPABASE_DB_URL (a real Postgres) and skip themselves without it.
        run: npm test
